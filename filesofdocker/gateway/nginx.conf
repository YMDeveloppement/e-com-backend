server {
    listen 80 default_server;
    server_name _;
    return 444; 
        
}

server {

    listen 80 ;
    # server_name _;
    # server_name myproject.local;
    server_name  myproject.local;
    # ========================================
    # REACT FRONTEND
    # ========================================

    location = /web {
        return 302 /web/;
    }


    location /storage/ {
        proxy_pass http://core:80/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /web/ {

        proxy_pass http://frontend:80/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }


    # ========================================
    # CORE SERVICE - Laravel 10
    # ========================================

    location /api/core/ {

        proxy_pass http://core:80/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ========================================
    # STOCK SERVICE - Laravel 13
    # ========================================

    location /api/stock/ {

        proxy_pass http://stock:80/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ========================================
    # DELIVERY SERVICE - Laravel 13
    # ========================================

    location /api/delivery/ {

        proxy_pass http://delivery:80/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ========================================
    # OPTIONAL DEFAULT
    # ========================================
    location = / {
        return 301 /web/;
    }

    location / {
        return 404;

    }
}